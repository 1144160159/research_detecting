# - role: raw | truth | quality | processed
#   sensor: zeek
#   path: raw/<run_id>/network/zeek/conn.log
#   size_bytes: 0
#   sha256: null
#   record_count: null
#   time_start: null
#   time_end: null

truth:
  steps_path: truth/<run_id>/steps.jsonl
  alignment_edges_path: truth/<run_id>/alignment_edges.jsonl
  chain_path: truth/<run_id>/chain.json
  annotation_log_path: truth/<run_id>/annotation_log.jsonl
