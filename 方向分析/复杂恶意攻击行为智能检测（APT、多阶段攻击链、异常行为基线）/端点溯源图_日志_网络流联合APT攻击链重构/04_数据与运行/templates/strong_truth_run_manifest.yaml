schema_version: strong-truth-manifest-v0.1
dataset_version: STRONG-TRUTH-v0
run_id: RUN-YYYYMMDD-NNN
run_type: attack  # attack | benign | hard_negative
scenario_family: S1
authorized_environment: true

time:
  timezone: UTC
  start: null
  end: null
  ntp_source: null
  host_clock_offsets_ns: {}
  p95_residual_ns: null

topology:
  topology_id: null
  hosts: []
  users: []
  network_segments: []
  randomized_fields: []

orchestration:
  framework: null  # CALDERA | AtomicRedTeam | manual
  version_or_commit: null
  adversary_profile: null
  operation_id: null
  ability_or_test_ids: []
  input_manifest: null

sensors:
  windows_sysmon: {enabled: false, config_hash: null, version: null}
  windows_security: {enabled: false, policy_hash: null}
  powershell: {enabled: false, policy_hash: null}
  linux_auditd: {enabled: false, rules_hash: null, version: null}
  linux_ebpf: {enabled: false, collector: null, config_hash: null, version: null}
  zeek: {enabled: false, config_hash: null, version: null}
  suricata: {enabled: false, config_hash: null, version: null}
  netflow: {enabled: false, exporter: null, sampling_rate: 1}
  pcap: {enabled: false, capture_point: null, packet_loss_estimate: null}

files: []
