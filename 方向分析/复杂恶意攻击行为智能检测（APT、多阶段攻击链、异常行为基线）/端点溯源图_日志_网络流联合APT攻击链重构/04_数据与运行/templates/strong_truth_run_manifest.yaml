  agreement_kappa: null
  adjudicator: null

quality:
  report_path: quality/<run_id>.json
  key_field_parse_rate: null
  ambiguity_rate: null
  known_missing_intervals: []
  passed_data_gate: false

split:
  split_id: null
  partition: unassigned  # train | validation | test | unassigned
  leakage_audit_path: null

governance:
  license_or_authorization_ref: null
  contains_personal_data: false
  contains_credentials: false
  anonymization_version: null
  access_group: null
  retention_until: null
  external_release_allowed: false

code:
  collector_commit: null
  converter_commit: null
