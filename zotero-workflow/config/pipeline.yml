topic: "加密流量异常检测"
focus:
  - open-set detection
  - self-supervised learning
  - multimodal traffic analysis
  - intrusion detection
  - malicious encrypted traffic
  - decision boundary and reject option

local_corpus:
  path: "paper"
  file_glob: "*.pdf"
  extract_pages: 3
  max_pdfs_per_run: 0
  overwrite: false

external_search:
  default_max_results_per_source: 3
  sources:
    semantic:
      enabled: true
      max_results: 3
      max_requests_per_run: 1
      wait_seconds_between_requests: 60
    core:
      enabled: true
      max_results: 3
    arxiv:
      enabled: true
      max_results: 3
    crossref:
      enabled: true
      max_results: 3
    openalex:
      enabled: true
      max_results: 3
    dblp:
      enabled: true
      max_results: 3
    unpaywall:
      enabled: true
      max_results: 3

screening:
  keep_threshold: 28
  maybe_threshold: 12
  batch_size: 50
  require_reason_for_reject: true

automation:
  dry_run_by_default: true
  write_logs: true
  stop_before_zotero_writeback: true
  stop_before_full_pdf_parse: true
