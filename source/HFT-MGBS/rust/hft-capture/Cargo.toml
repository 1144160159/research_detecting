[package]
name = "hft-capture"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
aya = "0.12"
clap = { version = "4.4", features = ["derive"] }
crossbeam-channel = "0.5"
libc = "0.2"
probe-agent = { path = "../../../traffic-analysis-platform/rust/probe-agent/probe-agent" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
