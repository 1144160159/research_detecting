[package]
name = "hft-dpdk"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hft-capture = { path = "../hft-capture" }
libc = "0.2"
probe-agent = { path = "../../../traffic-analysis-platform/rust/probe-agent/probe-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
